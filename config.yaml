# Configuration for Teledyne MQTT
# This file controls MQTT broker settings for all modules
scope:
  transport: usb  # usb or lan
  # usb_resource: "USB0::0xVID::0xPID::SERIAL::INSTR"  # Leave unset for discovery.
  # visa_backend: "@py"  # USB defaults to @ivi on Windows and @py elsewhere.
  # host: "192.168.1.50"  # For scope.transport: lan

mqtt:
  # Broker connection settings
  broker: "localhost" # MQTT broker hostname or IP address
  port: 1883 # MQTT broker port (default: 1883, 8883 for SSL/TLS)

  # Waveform publisher settings
  waveform:
    topic: "lqt/teledyne/waveform" # Topic for publishing waveform data
    config_topic: "lqt/teledyne/config" # Topic for publishing configuration changes

  # Optional overrides. The default settings topics follow the waveform prefix.
  # settings:
  #   command_topic: "lqt/teledyne/cmnd/settings"
  #   response_topic: "lqt/teledyne/response/settings"
